name: "KineForge Autonomous Cloud Factory"

on:
  schedule:
    # 18:00 UTC = 20:00 hora local de España (CEST / las 8)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal destino (Nombre del Environment en GitHub, ej: Zorojin, Trunkten)"
        required: true
        default: "Zorojin"
        type: string
      history_index:
        description: "Índice de la historia en Google Sheets (0 = primera)"
        required: false
        default: "0"
        type: string
      story:
        description: "Título o identificador de la historia en Google Sheets"
        required: false
        default: ""
        type: string
      chapter_num:
        description: "Número de capítulo a producir (1..5 o 'full')"
        required: true
        default: "1"
        type: string
      dry_run:
        description: "Modo simulación (sin subir a YouTube)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  produce_and_upload:
    name: "Produce and Upload Chapter (${{ github.event.inputs.channel || 'Zorojin' }})"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.channel || 'Zorojin' }}

    steps:
      - name: "Checkout repository and assets library"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "Install FFmpeg and build tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libass-dev libsndfile1 build-essential

      - name: "Setup Python 3.10 with Cache"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'runner/requirements.txt'

      - name: "Install Python dependencies"
        run: |
          pip install pip==24.0 setuptools==69.5.1 wheel
          pip install torch==2.1.1 torchaudio==2.1.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.23.5 hydra-core==1.0.7 omegaconf==2.0.6
          pip install -r runner/requirements.txt

      - name: "Run Autonomous Cloud Factory (Full Production & YouTube Upload)"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_DEFAULT_MODEL_ID: ${{ secrets.FISH_DEFAULT_MODEL_ID }}
        run: |
          HIST_IDX="${{ github.event.inputs.history_index || '0' }}"
          CHAPTER="${{ github.event.inputs.chapter_num || '1' }}"
          STORY="${{ github.event.inputs.story || '' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python runner/cloud_factory.py \
            --history-index "${HIST_IDX}" \
            --story "${STORY}" \
            --chapter-num "${CHAPTER}" \
            --work-dir "${RUNNER_TEMP}/factory_work" \
            --output-video "${RUNNER_TEMP}/video_capitulo_${CHAPTER}.mp4" \
            ${DRY_RUN_FLAG}

      - name: "Generate Lightweight Web/Mobile Preview (720p FastStart)"
        if: always()
        run: |
          CHAPTER="${{ github.event.inputs.chapter_num || '1' }}"
          MASTER="${RUNNER_TEMP}/video_capitulo_${CHAPTER}.mp4"
          
          # Cargar info de historia si existe
          INFO_FILE="${RUNNER_TEMP}/factory_work/story_info.json"
          if [ -f "$INFO_FILE" ]; then
            STORY_ID=$(python -c "import json; print(json.load(open('${INFO_FILE}', encoding='utf-8'))['story_id'])")
            STORY_TITLE=$(python -c "import json; print(json.load(open('${INFO_FILE}', encoding='utf-8'))['story_title'])")
          else
            STORY_ID="h0"
            STORY_TITLE="${{ github.event.inputs.story || 'Historia KineForge' }}"
          fi

          PREVIEW="${RUNNER_TEMP}/preview_${STORY_ID}_cap_${CHAPTER}.mp4"
          FALLBACK_PREVIEW="${RUNNER_TEMP}/preview_capitulo_${CHAPTER}.mp4"

          if [ -f "$MASTER" ]; then
            echo "⚡ Comprimiendo preview ultraligera 720p FastStart para móvil..."
            ffmpeg -y -i "$MASTER" \
              -vf "scale=-2:720" \
              -c:v libx264 -preset veryfast -crf 28 \
              -c:a aac -b:a 128k -ar 48000 \
              -movflags +faststart \
              "$PREVIEW"

            # Copiar también a preview_capitulo_${CHAPTER}.mp4 para retrocompatibilidad
            cp "$PREVIEW" "$FALLBACK_PREVIEW" || true

            MASTER_MB=$(du -m "$MASTER" | cut -f1)
            PREVIEW_MB=$(du -m "$PREVIEW" | cut -f1)
            echo "MASTER_MB=${MASTER_MB}" >> $GITHUB_ENV
            echo "PREVIEW_MB=${PREVIEW_MB}" >> $GITHUB_ENV
            echo "STORY_ID=${STORY_ID}" >> $GITHUB_ENV
            echo "STORY_TITLE=${STORY_TITLE}" >> $GITHUB_ENV
            echo "✅ Preview creada con éxito: ${PREVIEW_MB} MB (vs ${MASTER_MB} MB master)"
          else
            echo "⚠️ No se encontró vídeo master para comprimir."
          fi

      - name: "Publish Preview for Mobile Streaming & Job Summary"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHAPTER="${{ github.event.inputs.chapter_num || '1' }}"
          INFO_FILE="${RUNNER_TEMP}/factory_work/story_info.json"
          if [ -f "$INFO_FILE" ]; then
            STORY_ID=$(python -c "import json; print(json.load(open('${INFO_FILE}', encoding='utf-8'))['story_id'])")
            STORY_TITLE=$(python -c "import json; print(json.load(open('${INFO_FILE}', encoding='utf-8'))['story_title'])")
          else
            STORY_ID="h0"
            STORY_TITLE="${{ github.event.inputs.story || 'Historia KineForge' }}"
          fi

          PREVIEW="${RUNNER_TEMP}/preview_${STORY_ID}_cap_${CHAPTER}.mp4"
          FALLBACK_PREVIEW="${RUNNER_TEMP}/preview_capitulo_${CHAPTER}.mp4"
          TAG="previews"

          if [ -f "$PREVIEW" ]; then
            # 1. Actualizar catálogo de previsualizaciones
            echo "📋 Actualizando catálogo manifest_previews.json..."
            python runner/update_manifest.py "$INFO_FILE" "manifest_previews.json" || true

            echo "🚀 Subiendo preview y catálogo a GitHub Releases..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG ya existe. Actualizando assets con --clobber..."
              gh release upload "$TAG" "$PREVIEW" "$FALLBACK_PREVIEW" "manifest_previews.json" --clobber || true
            else
              echo "Release $TAG no existe aún. Creando release y subiendo assets..."
              gh release create "$TAG" "$PREVIEW" "$FALLBACK_PREVIEW" "manifest_previews.json" \
                --title "KineForge Video Previews" \
                --notes "Previsualizaciones automáticas para streaming en navegadores y móviles" \
                --target main || true
            fi

            # 2. Persistir manifest en la rama main para GitHub Pages
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add manifest_previews.json || true
            git commit -m "chore(manifest): update previews catalog [skip ci]" || true
            git push origin main || true

            ENCODED_TITLE=$(python -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "${STORY_TITLE}")
            PREVIEW_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/preview_${STORY_ID}_cap_${CHAPTER}.mp4"
            WEB_PLAYER="https://javy16s.github.io/Kineforge-Cloud-Render/?story=${STORY_ID}&ch=${CHAPTER}&title=${ENCODED_TITLE}&t=$(date +%s)"

            echo "## 🎬 ¡Previsualización Lista para Móvil y Navegador!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ⚡ **Historia:** **${STORY_TITLE}** (ID: \`${STORY_ID}\`)" >> $GITHUB_STEP_SUMMARY
            echo "> ⚡ **Optimizado para Móvil (Sin descargar 2 GB):** Vídeo 720p con FastStart (~${PREVIEW_MB} MB en vez de ${MASTER_MB} MB). Se reproduce al instante en el navegador de tu móvil o PC." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📱 [▶️ Abrir en Reproductor Web / Móvil (Streaming Instantáneo)](${WEB_PLAYER})" >> $GITHUB_STEP_SUMMARY
            echo "### 📥 [Descargar MP4 Ligero (${PREVIEW_MB} MB)](${PREVIEW_URL})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Parámetro | Valor |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **Historia** | ${STORY_TITLE} |" >> $GITHUB_STEP_SUMMARY
            echo "| **ID Historia** | \`${STORY_ID}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Capítulo** | ${CHAPTER} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Peso Preview Web** | **${PREVIEW_MB} MB** |" >> $GITHUB_STEP_SUMMARY
            echo "| **Peso Master (1080p)** | ${MASTER_MB} MB |" >> $GITHUB_STEP_SUMMARY
            echo "| **Modo** | ${{ github.event.inputs.dry_run == 'true' && '🧪 Testing (Dry-Run)' || '🚀 Producción' }} |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Save rendered video as Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "video-capitulo-${{ github.event.inputs.chapter_num || '1' }}"
          path: |
            ${{ runner.temp }}/video_capitulo_*.mp4
            ${{ runner.temp }}/preview_*.mp4
          retention-days: 7
