name: "KineForge Cloud Render & YouTube Upload"

on:
  workflow_dispatch:
    inputs:
      projects:
        description: "JSON array de proyectos a procesar"
        required: true
        default: '[{"channel":"canal1","project":"goku_encerrado_mil_anos_cap1","branch":"temp-render-zorojin-cap1"}]'
        type: string

permissions:
  contents: write

jobs:
  render_and_upload:
    name: "Render and Upload: ${{ matrix.project.channel }} - ${{ matrix.project.project }}"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event.inputs.projects) }}
    environment: ${{ matrix.project.channel }}

    steps:
      - name: "Checkout base code"
        uses: actions/checkout@v4
        with:
          ref: main

      - name: "Checkout ephemeral branch assets"
        if: matrix.project.branch != '' && matrix.project.branch != 'main'
        run: |
          echo "Descargando assets de la rama efimera: ${{ matrix.project.branch }}"
          git fetch origin ${{ matrix.project.branch }}:${{ matrix.project.branch }}
          git checkout ${{ matrix.project.branch }} -- "projects/${{ matrix.project.channel }}/${{ matrix.project.project }}" || true

      - name: "Install FFmpeg"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libass-dev

      - name: "Setup Python 3.10 with Cache"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'runner/requirements.txt'

      - name: "Install Python dependencies"
        run: |
          pip install -r runner/requirements.txt

      - name: "Render Video with FFmpeg"
        run: |
          PROJECT_DIR="projects/${{ matrix.project.channel }}/${{ matrix.project.project }}"
          python runner/render.py \
            --manifest "${PROJECT_DIR}/manifest.json" \
            --assets "${PROJECT_DIR}/assets" \
            --output "${RUNNER_TEMP}/output_${{ matrix.project.project }}.mp4"

      - name: "Save rendered video as Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "video-${{ matrix.project.project }}"
          path: "${{ runner.temp }}/output_${{ matrix.project.project }}.mp4"
          retention-days: 1

      - name: "Upload to YouTube (or Dry-Run)"
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          PROJECT_DIR="projects/${{ matrix.project.channel }}/${{ matrix.project.project }}"
          python runner/upload_youtube.py \
            --video "${RUNNER_TEMP}/output_${{ matrix.project.project }}.mp4" \
            --metadata "${PROJECT_DIR}/metadata.json"

      - name: "Auto-cleanup ephemeral branch"
        if: always() && matrix.project.branch != '' && matrix.project.branch != 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Eliminando rama temporal ${{ matrix.project.branch }} del repositorio..."
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ matrix.project.branch }}" || echo "Rama ya eliminada o no encontrada."
